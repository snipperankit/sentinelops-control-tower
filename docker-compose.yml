name: sentinelops-control-tower

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      # Optional: copy .env.example to .env for local overrides; compose runs fine without it.
      - path: .env
        required: false
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./:/workspace
      - /workspace/node_modules
    working_dir: /workspace
    # Placeholder command until apps/cockpit and harness services exist.
    command: ["npm", "run", "health"]
    healthcheck:
      test: ["CMD", "npm", "run", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Optional local "live" backends for the harness adapters (mcp/db,
  # mcp/observability/grafana-adapter.ts, mcp/mail). Opt-in only, via
  # `npm run live:up` (docker compose --profile live up -d ...), so a plain
  # `docker compose up` keeps the current demo-mode-only behavior. None of
  # these are reachable from sandbox/ (the generated-code sandbox stays
  # network-isolated regardless — see sandbox/README.md). See README.md's
  # "Local live stack" section for setup steps.

  postgres:
    image: postgres:16-alpine
    profiles: ["live"]
    environment:
      POSTGRES_USER: sentinelops
      POSTGRES_PASSWORD: sentinelops-local-only
      POSTGRES_DB: sentinelops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelops"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    profiles: ["live"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    profiles: ["live"]
    depends_on:
      - prometheus
    environment:
      # Local-only default; change if exposing this beyond localhost.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["live"]
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
